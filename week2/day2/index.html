# The Lab Master

.boxed-content.large[
A **Lab Master** is a student whose group has been ticked at the checkpoint, and who then
stops working on the extensions and answers other groups' questions for the rest of the
round. One per round; the role moves every round, like driver, mapper and referee.
]

.kicker[appointment]

# Transformations and actions

.cards.cols-2[
.card[
.kicker[builds the plan]

### Transformation

`select`, `filter`, `groupBy`, `orderBy`, `join`. Returns a new DataFrame. Reads
nothing.
]
.card[
.kicker[runs the plan]

### Action

`show`, `take`, `count`, `collect`, `write`. Submits a job and returns data.
]
]

.boxed-content.small[
```console
>>> counts = words.groupBy("word").count().orderBy(desc("count"))   # returns at once
>>> counts.take(15)                                                 # 11 s of actual work
```
]

.admonition[
<i class="fa-solid fa-circle-right"></i> `explain()` prints the plan **without running it**. That is why, in your output, the plan appears above the words.
]

# Reading the execution plan

.boxed-content.small[
```text
== Physical Plan ==
AdaptiveSparkPlan isFinalPlan=false
+- Sort [count#8L DESC NULLS LAST], true, 0
   +- Exchange rangepartitioning(count#8L DESC NULLS LAST, 200), ENSURE_REQUIREMENTS
      +- HashAggregate(keys=[word#3], functions=[count(1)])
         +- Exchange hashpartitioning(word#3, 200), ENSURE_REQUIREMENTS
            +- HashAggregate(keys=[word#3], functions=[partial_count(1)])
               +- Filter (length(word#3) >= 3)
                  +- Generate explode(split(lower(value#0), \W+, -1)), false, [word#3]
                     +- FileScan text [value#0] ... InMemoryFileIndex(18846 paths)
```
]

.boxed-content.no-bullet[
* Read it **bottom-up**. `FileScan` happens first, `Sort` last.
* **`Exchange` is a shuffle**: rows move between partitions. On a cluster, across the network.
* `HashAggregate` twice &rarr; count within each partition, then combine.
]

# Stages and tasks

.boxed-content.large[
A **stage** is a run of work with no shuffle inside it. Every `Exchange` in the
plan is a stage boundary.

Within a stage, Spark runs **one task per partition**.
]

.boxed-content.large.no-bullet[
* Before the shuffle: **589 tasks**, one per input partition.
* After it: **27 tasks**, because Spark sized the next stage to the data it actually got.
]

.admonition[
<i class="fa-solid fa-circle-right"></i> Partitions are not free. Each one is a task to schedule, ship to a core, and collect back.
]

# What an orchestrator does that a script does not

.cards.cols-2.tight[
.card.small[
.kicker[a shell script]

### Runs the steps in order and stops when one fails

Restarting means running it again from the top, including everything that already
succeeded. Which step failed is in the terminal you closed.

.foot[This is &micro;Lab 2's `make` target, and it is fine until a step takes an hour.]
]
.card.small[
.kicker[an orchestrator]

### Knows what each step needs and what it produced

It records every run, retries a step that failed without redoing the ones that did not,
and keeps the logs of each step separately from the others.

.foot[Descriptif objective 2, in the words it uses: failures, logging and retries.]
]
]

.boxed-content.large[
The word **orchestration** is doing two jobs in this course. Kubernetes orchestrates
**services** that are meant to run forever. A workflow engine orchestrates **tasks** in a
finite graph that is meant to finish. Same word, different problem.
]

# Four ways to describe a pipeline

.boxed-content.data-table.small[
| | Airflow | Nextflow | Flyte | Dagster |
|:--|:--|:--|:--|:--|
| Pipeline is | a Python program | dataflow through channels | typed Python functions | declared assets |
| Graph comes from | explicit edges (`>>`) | inferred from connections | values passed between tasks | inferred from dependencies |
| Optimised for | scheduled operations | scientific batch | typed, cached batch | lineage and rebuilds |
| Per-step containers | possible, not idiomatic | idiomatic, per process | idiomatic, per task | via infrastructure |
| Resume after failure | retries per task | hash-based `-resume` | `cache=True` per task | stale-asset rebuild |
| Runs once or forever | forever, on a calendar | once, to completion | once; schedules separate | forever, asset-driven |
]

.admonition[
<i class="fa-solid fa-circle-right"></i> The axis that actually decides it is **scheduled
operations versus scientific batch**. An operational workflow runs forever on a calendar
and needs connectors and an audit trail. A scientific pipeline runs an analysis and stops,
and needs per-step environments and a cheap resume.
]

???

Airflow is the industry reference and is named in the module descriptif. It is taught
here, on this slide, as the thing the others are measured against. Our labs use Flyte
because this course is the second column, not the first.

# Passing data: XCom

.boxed-content.large[
```python
from airflow.operators.python import PythonOperator

def produce(**ctx):
    return "hello"

def consume(**ctx):
    ti = ctx["ti"]
    print("Got:", ti.xcom_pull(task_ids="produce"))

p = PythonOperator(task_id="produce", python_callable=produce)
c = PythonOperator(task_id="consume", python_callable=consume, provide_context=True)
p >> c
```
]

.gray-text.larger[Useful sparingly; for larger data, persist to files/objects and pass **references**.]
