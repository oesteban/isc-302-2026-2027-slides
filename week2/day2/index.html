.boxed-content[

]

# Let's jump back to 1998

.boxed-content[
<object type="image/svg+xml" data="images/big-data-google.svg" style="width: 100%; padding-top: 20pt;"></object>
]

???

- Google's search engine, as a data pipeline, in three stages:
  - **Crawling**: download a URL, parse its links, download the new links.
  - **Indexing**: extract the keywords of each page, index them, update them as pages change.
  - **Ranking**: run PageRank, then combine keywords with the ranking to answer a query.
- **PageRank** is named after Larry Page. It ranks a page by the links that point to it from other pages, weighted by the rank of those pages.
- In the same years, Doug Cutting and Mike Cafarella built **Nutch**, an open-source search engine, on a single machine: one CPU core, 1 GB of RAM, eight disks in RAID 1 (1 TB), about 3 000 USD. It indexed about 100 pages per second.
- One machine kept the operations simple, and it capped the index at about 100 million pages. The web was already larger than that.
- Both teams needed the pipeline to run on many machines at once.

# Growing problems
.boxed-content.large.no-bullet[
* .larger[<i class="fa-solid fa-money-bill-trend-up"></i> **Cost**: data **movement** and **materialization**:]
  * .larger.gray-text[Store **very large files** for cheap.]
  * .larger.gray-text[**High throughput** over low latency.]
]

???

- With data spread over many machines, two operations dominate the running time:
  - **Data movement**: copying bytes over the network, from one machine to another.
  - **Materialization**: writing an intermediate result to disk, so that the next step can read it back.
- CPU work (for example, counting words) is cheap next to both. Quiz: Q22.
- The requirements that follow:
  - store very large files on cheap hardware;
  - favour **throughput** (bytes processed per second, over the whole job) over **latency** (time to answer one request).
- A batch job over the whole web can take hours. Its cost is measured in machines and disks per terabyte processed.

# Solution

.boxed-content.large.no-bullet[
* .larger[<i class="fa-solid fa-money-bill-trend-up"></i> **Cost**: data **movement** and **materialization**:]
  * .larger.gray-text[Store **very large files** for cheap.]
  * .larger.gray-text[**High throughput** over low latency.]

<br />

* .larger[<i class="fa-solid fa-folder-tree"></i> Resolved with a new **file system**:]
  * .larger.gray-text[Running on ***commodity* hardware** (Cheap computers, fast to scale in numbers).]
  * .larger.gray-text[**Fault tolerance** implemented by software.]
]

???

- Google's answer was a distributed file system, the Google File System (GFS).
- **Commodity hardware**: many ordinary, inexpensive machines instead of a few expensive servers or a storage array (NAS). Growing the system means adding machines.
- With thousands of cheap machines, a disk or a machine fails every day. The GFS paper: *"The system is built from many inexpensive commodity components that often fail. It must constantly monitor itself and detect, tolerate, and recover promptly from component failures on a routine basis."*
- **Fault tolerance in software**: the file system keeps copies (replicas) of every piece of data on several machines and makes new copies when one is lost.
- What made GFS and HDFS cheap at scale (Quiz: Q9):
  - large sequential reads and writes, which disks do well;
  - commodity hardware, with failure treated as normal;
  - replication done by software.
- Expensive proprietary NAS arrays are the opposite design.

# GFS — how data is distributed

.boxed-content.large.no-bullet[
* <i class="fa-solid fa-file"></i> **Files** are divided in fixed-size chunks
  <br /> .indent.gray-text[**64 MB** each.]
  <br />
* <i class="fa-solid fa-copy"></i> **Default 3 replicas**
  <br /> .indent.gray-text[on different **chunkservers** (rack-aware placement).]
  <br />
* <i class="fa-solid fa-server"></i> A single **Master** keeps **metadata in memory**
  <br /> .indent.gray-text[a table of (filename&chunk, locations).]
  <br />
* <i class="fa-solid fa-terminal"></i> **Clients** ask the Master for **chunk locations**
  <br /> .indent.gray-text[however, read/write occurs **directly to chunkservers**.]
]

???

- A file is cut into fixed-size **chunks** of 64 MB. Quiz: Q2.
- Each chunk is stored **3 times**, on 3 different **chunkservers** (the machines that hold data). Rack-aware placement puts copies in different racks, so one failed rack switch does not lose all three.
- Large chunks keep the list of all chunks small enough to fit in the Master's RAM, and they make every read long and sequential.
- The **Master** holds only **metadata**: the namespace (file names), and for each chunk the chunkservers that hold it.
- Reading a file:
  1. the client asks the Master which chunkservers hold chunk N of the file;
  2. the client reads the bytes **directly from a chunkserver**.
- File data never passes through the Master. If it did, the single Master would be the bottleneck and the cluster could not grow. Quiz: Q1, Q18 (both false statements).
- The table of chunk locations is also what lets a scheduler run a computation on a machine that already holds the data (data locality, two slides ahead).

# MapReduce (2004)

.boxed-content.center[
<object type="image/svg+xml"
        data="images/map-reduce.svg"
        id="svg-mapreduce-quiz"
        style="width:95%"></object>
]

???

- MapReduce is a programming model and its runtime. The programmer writes two functions, `map` and `reduce`. The framework runs them on many machines and handles distribution, scheduling and failures.
- The steps in the figure, for a word count:
  - **Input**: the documents, stored in GFS as chunks.
  - **Split**: the input is divided into **input splits**. A split is a logical slice of the input, used to assign one map task. It is usually aligned with one chunk (or HDFS block), but it is a different concept: a chunk is a unit of storage and replication, a split is a unit of work. Quiz: Q10, Q24.
  - **Map**: each map task reads its split and emits `(key, value)` pairs, here `(token, 1)` for every word. Millions of pairs.
  - **Shuffle**: pairs with the same key are brought together. Reducers **pull** the map outputs over the network. This is the data-movement cost from the "Growing problems" slide. Quiz: Q25.
  - **Reduce**: each reduce task receives one key with all its values and combines them: `(apple, [1, 1, 1, 1])` becomes `(apple, 4)`.
  - **Output**: the reducers write the final table to GFS.
- **Data locality**: the scheduler asks the file system where the replicas of each split are, and starts the map task on one of those machines. The task runs on a machine that stores its input, and reads it from a local disk. Quiz: Q3.
- **Materialization points** (where data is written to disk, Quiz: Q4, Q5, Q8):
  - the map output, written to the **mapper's local disk** (not to GFS);
  - the final reduce output, written to GFS/HDFS.
- Reading the input from GFS is not a materialization point: that data was already on disk before the job started.
- Map outputs are temporary. Replicating them 3 times in GFS would cost network and disk for data that is deleted once the job ends. If a mapper's machine dies, the framework re-runs that map task.

# MapReduce — word count (pseudocode)

.boxed-content.large[

``` Python
def map(_, line):
    for w in tokenize(line.lower()):
        if w and w not in STOPWORDS:
            yield (w, 1)

def shuffle(pairs):
    grouped = defaultdict(list)
    for k, v in pairs:
        grouped[k].append(v)
    return grouped.items()

def reduce(word, counts):
    return (word, sum(counts))
```
]

???

- `map` is called once per line. It emits one pair `(word, 1)` per word that is not a stopword. `yield` emits a pair and continues the loop: one line produces many pairs.
- Stopwords are frequent words that carry no topic ("the", "and", "of"). They are removed before counting.
- `shuffle` groups all values by key. The programmer does not write this function: the framework does it, across machines, by sending each key to the reducer responsible for it. It is written out here to show what happens between the two user functions. Quiz: Q25.
- `reduce` is called once per word, with the list of all its counts, and returns the total.
- `map` sees one line at a time and `reduce` sees one key at a time. Neither needs the whole dataset, which is what lets the framework run thousands of copies of each in parallel.
- The same three steps come back in Spark as `flatMap`, `map` and `reduceByKey` (the "RDD vs. DataFrame" slide).

.boxed-content.large[
* Cutting and Cafarella were working on *Nutch* (an open-source web search engine).
  <br /> .indent.gray-text[Google published GFS in 2003, MapReduce in 2004.]

* In January 2006, D. Cutting was hired by Yahoo!
  <br /> .indent.gray-text[By 2016, Hadoop was adopted by Facebook, Twitter, Amazon AWS, Microsoft, LinkedIn, etc.]

* Hadoop re-implements Google's ideas: **HDFS** & **MapReduce**.

* **Data locality**: send compute to where blocks live.
]

???

- Google published the designs and kept the code. Cutting and Cafarella implemented both papers for Nutch.
- In 2006 Cutting joined Yahoo!, and the storage and processing part of Nutch became a separate Apache project: **Hadoop**.
- Hadoop has two parts, one per Google paper:
  - **HDFS** (Hadoop Distributed File System), the open-source counterpart of GFS;
  - **Hadoop MapReduce**, the open-source counterpart of MapReduce.
- **Data locality**: the scheduler places each map task on a node that holds a replica of its input block. What makes this possible is the file system's table of block locations, not faster networks or a central storage device. Quiz: Q3.

---

# HDFS — overview (vs GFS)

.boxed-content.large[
* **NameNode** (metadata) / **DataNodes** (blocks)
* Large **blocks**, replication, streaming reads
* Write-once, read-many reality (append came later)

.center[
![:img Official HDFS architecture diagram, 48%](https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/images/hdfsarchitecture.png)
]
]

???

- HDFS uses its own names for the GFS roles:

  | GFS | HDFS |
  |---|---|
  | Master | NameNode |
  | chunkserver | DataNode |
  | chunk (64 MB) | block (64 MB at first, 128 MB by default today) |

- The **NameNode** stores the namespace and the block-to-DataNode map. It stores no file contents and it is not on the data path: clients read and write blocks directly on DataNodes. Quiz: Q7, Q18.
- **Write-once, read-many**: a file is written, closed, and then only read. Appending to an existing file was added to HDFS later; GFS had record-append from the start. Quiz: Q6.
- There are no random in-place updates: a byte in the middle of an existing file cannot be overwritten. To change data, a new file is written. Quiz: Q21.
- The NameNode is one machine with limited memory and it holds no data, so heavy work (a reducer, for example) placed on it gains no locality and puts the whole file system at risk. Quiz: Q28.

name: mr_limits


# MapReduce limitations

.boxed-content.large[
* **Iterative ML/graph** workloads: too many **re-reads** and **shuffles**.

* **Materialization** between stages → heavy **disk I/O**.

* Limited **optimization** opportunities at the MapReduce job level.

* Users wanted **interactive** and **iterative** workloads.
]

???

- A MapReduce job is one map, one shuffle, one reduce. A longer computation is a chain of jobs.
- Each job in the chain writes its output to HDFS (3 replicas) and the next job reads it back. A chained pipeline therefore spends most of its time on disk and network I/O: it is disk-bound. Quiz: Q8.
- **Iterative** algorithms (PageRank, k-means, gradient descent) read the same data once per iteration. In MapReduce, every iteration reads it again from HDFS. Quiz: Q14, Q27.
- The framework sees each job separately, and only as opaque `map` and `reduce` functions. It cannot merge two jobs, skip a column, or reorder a filter.
- **Interactive** queries (ask, look at the answer, ask again) take minutes per question when every question is a new job that re-reads the data.

name: spark1

# Apache Spark (2009-2016)

.boxed-content.large[
* **HDFS** becomes a long-term storage layer.

* Immediate access now with **Resilient Distributed Dataset** (RDD).
  <br /> .gray-text[Data is loaded from HDFS **once**, then cached in memory.]

* Operations are chained in a **DAG**

* **Materialize** the output only at the end of the pipeline.
  <br /> .gray-text[To HDFS or other storage systems (S3, etc.).]
]

???

- Spark started at UC Berkeley's AMPLab in 2009 (Matei Zaharia) and became an Apache project.
- Storage and computation become separate layers. HDFS, or an object store such as S3, keeps the data long-term; Spark computes over it. Either layer can be replaced without changing the other. Quiz: Q28.
- **RDD** (Resilient Distributed Dataset): a collection of records that is
  - **partitioned**: split into pieces spread over the machines of the cluster;
  - **immutable**: an operation creates a new RDD and never modifies an existing one;
  - **fault-tolerant through lineage**: Spark records the operations that built each RDD from its inputs. If a partition is lost, Spark recomputes it from that record instead of keeping replicas. Quiz: Q11.
- An RDD can be **cached** in the executors' memory. An iterative algorithm reads the data from HDFS once and then works on the in-memory copy. Quiz: Q14, Q27.
- The operations of a program form a **DAG** (directed acyclic graph). Spark sees the whole graph before running it, so it can group operations into stages and keep shuffles (wide dependencies) to a minimum. Quiz: Q23.
- Intermediate results stay in memory. Only the final result is written to storage.

"""
Spark job reading the 20 Newsgroups text files from an NFS path,
applying a stopword filter, and printing the top 15 most frequent tokens.
"""

  for line in STOPWORDS_PATH.read_text().splitlines() if line.strip()
}

```

# Script *PySpark* (2)

.boxed-content.larger[
```python
def main():
    # 1. Initialize Spark
    spark = SparkSession.builder \
        .appName("WordCountOnNFS") \
        .getOrCreate()

    # 2. Read text files as a DataFrame (one column: "value")
    text_df = spark.read.text(f"{NEWSGROUPS_PATH}/*.txt")

    # 3. Split each line into tokens, explode into rows
    words_df = text_df.select(
        F.explode(
            F.split(F.col("value"), r"\W+")
        ).alias("token")
    )

    # 4. Convert to lowercase
    words_df = words_df.select(F.lower(F.col("token")).alias("token"))

```
]

???

- `SparkSession` is the entry point: it connects the driver to the cluster.
- `spark.read.text` returns a **DataFrame** with one column, `value`, and one row per line of text.
- With `*.txt` over 18 846 files, Spark creates about one partition per file: many tiny partitions, and one task per partition. µLab 1 measures what that costs.
- `F.split(..., r"\W+")` cuts a line at every run of non-word characters. `F.explode` turns the resulting list into one row per token.
- None of these lines reads any data. They are **transformations**: each one adds a step to the plan and returns immediately.
- These transformations are **narrow**: each output partition depends on one input partition, and no data moves between machines. Quiz: Q19.

        (F.col("token") != "") &
        (~F.col("token").rlike("^[0-9]+$")) &
        (~F.col("token").isin(stopword_list))
    )

    # 6. Group by token, count occurrences
    counts_df = words_df.groupBy("token").count()

    # 7. Get the top 15 words by descending frequency
    top_15 = counts_df.orderBy(F.desc("count")).limit(15)

    # 8. Show results
    top_15.show(truncate=False)

    spark.stop()

if __name__ == "__main__":
    main()
```

]

???

- `filter` is narrow: it keeps or drops each row within its own partition.
- `groupBy("token").count()` is **wide**: all rows with the same token must end up in the same partition, so rows move between partitions. That movement is a **shuffle** (`Exchange` in the plan). Quiz: Q13, Q19.
- `orderBy` is wide too: a global sort needs rows from every partition. `groupBy` and `orderBy` each add one shuffle to the plan, which is what Monday's µLab 3 found.
- A **stage** is a run of narrow operations with no shuffle inside. Stage boundaries fall at wide transformations. A `map`, a `filter`, or reading a new source does not start a new stage, and neither does `coalesce` (narrow unless asked to shuffle). Quiz: Q17.
- Using the DataFrame API does not remove shuffles: `groupBy` and `orderBy` shuffle whatever API expresses them. Quiz: Q12.
- `show` is an **action**: it asks for a result, and only then does Spark run the plan.
- The DataFrame API is **declarative**: the code says *what* to compute (group, count, order). Spark's optimiser chooses *how*: it can drop unused columns, move a filter earlier, and count within each partition before the shuffle, so less data moves. Quiz: Q15, Q26.
- Reading a **columnar** format such as Parquet instead of text lets the reader skip columns that are not used (column pruning) and skip blocks whose statistics rule out a filter (predicate pushdown). Quiz: Q16.

# RDD vs. DataFrame

.boxed-content[
```python
    # 2. Read text files into RDD
    text_rdd = spark.sparkContext.textFile(f"{NEWSGROUPS_PATH}/*.txt")

    # 3-4. Convert to lowercase and split into tokens
    tokens_rdd = text_rdd.flatMap(
        lambda line: re.split(r"\W+", line.lower())
    )

    # 5. Filter out empty strings, numeric tokens, and stopwords
    filtered_rdd = tokens_rdd.filter(
        lambda token: (
            token != "" and
            not re.match(r'^[0-9]+$', token) and
            token not in stopword_list
        )
    )

    # 6. Map each token to (token, 1), then reduce
    word_counts = filtered_rdd.map(lambda w: (w, 1)) \
                              .reduceByKey(lambda a, b: a + b)

    # 7. Retrieve the top 15 by descending frequency
    top_15 = word_counts.takeOrdered(15, key=lambda x: -x[1])
```
]

???

- The same count written with the RDD API. It maps directly onto the MapReduce pseudocode:
  - `flatMap`: one line in, many tokens out (the `map` loop);
  - `map(lambda w: (w, 1))`: the `(word, 1)` pairs;
  - `reduceByKey`: the shuffle and the `reduce` together. It is a wide transformation. Quiz: Q13.
- Narrow: `map`, `filter`, `flatMap`. Wide: `reduceByKey`, `groupBy`, and `join` in the general case (a join is narrow only when both sides are already partitioned the same way). Quiz: Q13.
- The lambdas are Python functions that Spark cannot look inside. It must run them exactly as written, on every record, in a Python process next to the JVM executor.
- The DataFrame version describes the same computation with relational operations (`select`, `filter`, `groupBy`), which the optimiser can rearrange and run inside the JVM. This is why the DataFrame count was faster on Monday. Quiz: Q26.
- RDDs are still the layer underneath DataFrames, and the right tool when the data has no tabular shape.

# Submission in HPC with *Slurm* (1)

.boxed-content.larger[
```bash
#!/bin/bash
#SBATCH --job-name=SparkWordCount
#SBATCH --nodes=4
#SBATCH --ntasks-per-node=1
#SBATCH --cpus-per-task=8
#SBATCH --time=01:00:00

module load spark/3.5.5

# 1. Identify allocated nodes
scontrol show hostnames $SLURM_NODELIST > node_list.txt

# 2. Pick the first node as Spark master
MASTER_NODE=$(head -n 1 node_list.txt)

# 3. Start Spark master on MASTER_NODE
if [ "$HOSTNAME" = "$MASTER_NODE" ]; then
  $SPARK_HOME/sbin/start-master.sh
fi
```

]

???

- **Slurm** is the job scheduler of most HPC clusters. A user submits a batch script with `sbatch`; Slurm waits until the requested resources are free, reserves them, and runs the script.
- The `#SBATCH` lines are the resource request (Quiz: Q20):
  - `--nodes=4`: four machines;
  - `--ntasks-per-node=1`: one process per machine (despite the word "node", this counts tasks);
  - `--cpus-per-task=8`: eight cores for each process;
  - `--time=01:00:00`: the job is killed after one hour.
- Total cores = nodes x ntasks-per-node x cpus-per-task = 4 x 1 x 8 = 32.
- `module load spark/3.5.5` puts that Spark version on the `PATH` (the cluster's software is installed as modules).
- `$SLURM_NODELIST` holds the names of the machines Slurm gave the job, in a compressed form; `scontrol show hostnames` prints one name per line.
- The script then builds a Spark standalone cluster by hand, inside the reservation: the first node becomes the Spark master.

# Submission in HPC with *Slurm* (2)

.boxed-content[
```bash
# 4. Start Spark workers on each allocated node
for node in $(cat node_list.txt); do
  srun -N1 -w "$node" "$SPARK_HOME/sbin/start-worker.sh" "spark://$MASTER_NODE:7077"
done

# 5. Submit the Spark job
$SPARK_HOME/bin/spark-submit \
  --master spark://$MASTER_NODE:7077 \
  --deploy-mode client \
  $PWD/wordcount.py

# 6. Stop Spark workers
for node in $(cat node_list.txt); do
  ssh $node "$SPARK_HOME/sbin/stop-worker.sh"
done

# 7. Stop Spark master on MASTER_NODE
if [ "$HOSTNAME" = "$MASTER_NODE" ]; then
  $SPARK_HOME/sbin/stop-master.sh
fi
```

]

???

- `srun -N1 -w "$node"` runs one command on one specific node of the reservation: here, a Spark worker that registers with the master at port 7077.
- `spark-submit --master spark://...:7077` sends the word-count application to that master. `--deploy-mode client` runs the driver on the machine where `spark-submit` was typed.
- Steps 6 and 7 stop the workers and the master. When the script ends, Slurm releases the four nodes.
- Compare with Monday's cluster:
  - **Slurm**: you ask for machines and a time limit, and your script decides what runs on them. The reservation is fixed for the whole job.
  - **Kubernetes**: you declare objects (a Deployment of `spark-worker` pods), and controllers keep them running and place them on nodes. `kubectl scale` changes the worker count while the cluster runs.
  - In both, Spark itself decides which task runs on which executor. Slurm and Kubernetes only provide the machines or pods.
- Topic 11 of today's changing hats compares the two schedulers in depth.

# Kubernetes interface (using `kubectl`)

.cards.cols-3[
.card[
.section-icon.corner[<i class="fa-solid fa-server"></i>]

.kicker[Nodes]

```
kubectl get nodes
```

Nodes run pods, we have created one: the k3s container.
]
.card[
.section-icon.corner[<i class="fa-solid fa-cube"></i>]

.kicker[Pods]

```
kubectl get pods
```

Containers scheduled together. K8s handles them for you.
]
.card[
.section-icon.corner[<i class="fa-solid fa-rotate"></i>]

.kicker[kubectl get deploy, get jobs]

### Controller

Compares declared against actual and closes the gap. It creates the pods.
]
]

???

- `kubectl` is a client program. It sends requests to the cluster's **API server** (port 6443) and prints the answers. It is not part of the cluster and can run on any machine that has the cluster's address and credentials. Quiz: Q29, Q30.
- A **node** is a machine that runs pods. Monday's cluster has one node: the `k8s` container on the laptop.
- A **pod** is one or more containers that are scheduled together on the same node and share its network address. It is the smallest thing Kubernetes runs.
- A **controller** is a loop inside the cluster that compares the declared state (for example, "3 pods of this Deployment") with the actual state, and creates or deletes objects until they match.
- Three components restart or place things, at three levels (Quiz: Q32):
  - **kubelet**: the agent on each node. When a container inside a pod stops, the kubelet starts it again in place, and `RESTARTS` goes up.
  - **controller**: when a whole pod is deleted, the Deployment's controller sees one pod missing and creates a new pod, with a new name.
  - **scheduler**: decides which node a new pod goes to.
- `kubectl describe pod` shows these components by name in its `Events` block (`From: kubelet`, `From: default-scheduler`).

# Deployment and Job

.cards.cols-2[
.card[
.kicker[always running]

### Deployment

Keeps **N pods running**. A pod that exits is replaced, **even on exit 0**.
]
.card[
.kicker[run once]

### Job

Runs a pod **until it exits 0**, then stops. Nothing is restarted.
]
]

.boxed-content.small[
```console
# kubectl create deployment NAME --image=IMG --replicas=3
# kubectl create job        NAME --image=IMG -- CMD ARGS
```
]

.admonition[
<i class="fa-solid fa-circle-right"></i> The whale prints its line and exits 0. Pick the wrong one and `RESTARTS` climbs.
]

???

- A **Deployment** declares a number of pods that should be running at all times. Its pods get `restartPolicy: Always`: the kubelet restarts a stopped container whatever its exit code, 0 included.
- A **Job** declares a task that should run to completion. Its pod runs until the container exits with code 0, and then nothing is restarted.
- Monday's whale (`ghcr.io/oesteban/whalesay`) prints a message and exits 0. Created as a Deployment, its pods cycle through `Running`, `Completed` and `CrashLoopBackOff`. Quiz: Q31.
- `CrashLoopBackOff` means the container keeps stopping and the kubelet waits longer and longer between restarts. Here the image works as intended; a Deployment is the wrong kind of object for a program that exits.
- The Spark master and workers are long-running services, so they are Deployments. A word count is a program that finishes, so a Job is the matching object.
- In `kubectl create job NAME --image=IMG -- CMD ARGS`, everything after `--` is the command run inside the container, not a kubectl option.

# Starting a cluster, and a client for it

.boxed-content.small[
```console
$ mkdir kube
$ docker run -d --name k8s --privileged --tmpfs /run --tmpfs /var/run \
    -p 6443:6443 -v "$PWD/kube:/output" \
    rancher/k3s:v1.36.4-k3s1 server --disable=traefik \
    --write-kubeconfig /output/config --write-kubeconfig-mode 644

$ grep server: kube/config
    server: https://127.0.0.1:6443
```
]

.boxed-content.large.no-bullet[
* **k3s** is a Kubernetes distribution packaged as one binary. One container, one node, one cluster.
* The cluster writes its address and credentials to **your laptop**, into `kube/config`.
* **`kubectl` is not part of the cluster.** It is a client, and it lives wherever you want.
]

???

- The command Monday's µLab 1 ran, on the laptop:
  - `-d --name k8s`: run in the background, as a container named `k8s`;
  - `--privileged --tmpfs /run --tmpfs /var/run`: k3s starts containers of its own, which needs full access to the host kernel and writable runtime directories;
  - `-p 6443:6443`: publish the API server's port on the laptop;
  - `-v "$PWD/kube:/output"`: share the laptop's `kube` folder with the container;
  - `server --disable=traefik`: run a k3s server, without its bundled ingress controller (Traefik), which the labs do not use;
  - `--write-kubeconfig /output/config --write-kubeconfig-mode 644`: write the client configuration into the shared folder, readable by everyone.
- `kube/config` (the **kubeconfig**) holds the API server address (`https://127.0.0.1:6443`) and the credentials. Any `kubectl` that reads this file can control the cluster.
- What listens on 6443 is the Kubernetes API server. Quiz: Q30.
- `kubectl` runs outside the cluster, here in a separate container or on the laptop, and talks to 6443. Quiz: Q29.
- The Flyte sandbox of µLab 3 is also a k3s cluster in one container and also publishes 6443. That is why `k8s` has to be stopped before it starts. Quiz: Q38.

# The cluster has its own image store

.boxed-content.large[
k3s runs **containerd**. Your laptop runs the **Docker daemon**. Separate stores.
]

.boxed-content.large.no-bullet[
* `docker images` &rarr; your laptop.
* `crictl images` &rarr; the cluster.
* `ghcr.io/<user>/<name>` &rarr; the only path between them.
]

.admonition[
<i class="fa-solid fa-circle-right"></i> The cluster pulls with no credentials, so the package must be **public**.
]

???

- A **container runtime** is the program that pulls images and runs containers. The laptop's is the Docker daemon. k3s brings its own, **containerd**, running inside the `k8s` container.
- Each runtime keeps its own image store. An image in `docker images` on the laptop is invisible to the cluster.
- This is why the first Spark pod on Monday took minutes to start even though `spark:3.5.4-python3` was already on the laptop: the cluster downloaded the 535 MB image again into its own store. Quiz: Q33.
- `crictl` is the command-line client for containerd. It exists only inside the `k8s` container: `docker exec k8s crictl images`.
- To get your own image into the cluster, push it to a registry (GitHub Container Registry, `ghcr.io`) and let the cluster pull it from there.
- The cluster has no GitHub credentials, so the package must be public (GitHub profile, *Packages*, package settings).

- `kubectl scale deployment spark-worker --replicas=4` changes one number stored in the Deployment. The Deployment's controller then creates or deletes pods until that many exist, and each new worker pod registers itself with the Spark master. Quiz: Q35.
- It does not start Docker containers on the laptop, does not change the cores of existing workers, and does not restart the Spark master.
- The **Spark master** keeps the list of workers and hands their cores and memory out to applications. It runs no tasks and stores no data. **Workers** run the executors, and executors run the tasks. Quiz: Q34.

- Why it is less than four (Quiz: Q37):
  - part of the run is not divided among workers at all: starting the application, planning, and collecting the result on the driver;

- Amdahl's law (week 1): if a fraction *s* of the run is serial, the speed-up with *N* workers is at most 1 / (*s* + (1 - *s*) / *N*). It can never exceed 1 / *s*, however many workers are added.
