# Why Airflow?

.boxed-content.larger.no-bullet[
* .large[<i class="fa-solid fa-circle-right"></i> You have a **pipeline**]
  <br /> .gray-text.indent[You have **multiple steps** that transform data; each depends on prior results.]

* .large[<i class="fa-solid fa-circle-right"></i> You need a powerful **scheduling** system]
  <br /> .gray-text.indent[Contrarian view: *[Airflow is just cron on steroids](https://www.youtube.com/watch?v=YQ056EKzCyw)*.]

* .large[<i class="fa-solid fa-circle-right"></i> You need easy access to **pipeline management**]
  <br /> .gray-text.indent[A solid *service* to query status, retries, alerts, logs, timing, lineage.]

* .large[<i class="fa-solid fa-circle-right"></i> You want pipeline **optimization**]
  <br /> .gray-text.indent[Tools like *Airflow*'s Gantt chart make the critical path obvious.]
]

.gray-text.large[Airflow focuses on *orchestration* (when/what/where), not the analytics themselves.]

???
Key idea: instead of humans running scripts in ad-hoc order,
Airflow coordinates tasks, enforces dependencies, and records outcomes & timings.

---

# Airflow's jargon

<br />

.boxed-content.no-bullet[
* .large[<i class="fa-solid fa-diagram-project"></i> **DAG** — name for pipelines in *Airflow*]
  <br /> .indent.gray-text[In fact, you save them under a folder called `dags/`]
  <br />
* .large[<i class="fa-solid fa-list-check"></i> **Task** — one node in the DAG]
  <br /> .indent.gray-text[Tasks are crated with **Operator**s]
  <br />
* .large[<i class="fa-solid fa-dharmachakra"></i> **Operator** — Python wrapper to run a kind of work]
  <br /> .indent.gray-text[We'll work with Bash, Python and Docker operators]
  <br />
* .large[<i class="fa-solid fa-object-group"></i> **Task Instance** — A task after execution of the corresponding DAG]
  <br />
  <br />
* .large[<i class="fa-solid fa-flag-checkered"></i> **Run** — a DAG execution]
]


---

# Airflow's Components

<br />

.boxed-content.no-bullet[
* .large[<i class="fa-solid fa-server"></i> **Webserver** — UI (Graph/Grid view), trigger runs, browse logs]
  <br />
  <br />
* .large[<i class="fa-solid fa-calendar-days"></i> **Scheduler** — decides *what* to run *when*; queues tasks]
  <br />
  <br />
* .large[<i class="fa-solid fa-person-digging"></i> **Workers** — where tasks actually run (processes/containers)]
  <br />
  <br />
* .large[<i class="fa-solid fa-database"></i> **Metadata DB** — persistent state (DAGs, runs, tasks, logs paths)]
  <br />
  <br />
* .large[<i class="fa-solid fa-clapperboard"></i> **Executor** — submits tasks to workers]
  <br />
  <br />
]

# First DAG

.boxed-content[
.large[
```python
from airflow import DAG
from airflow.operators.bash import BashOperator
from datetime import datetime

with DAG(
    dag_id="example",
    schedule_interval=None,  # on-demand first
) as dag:
    a = BashOperator(task_id="a", bash_command="echo A")
    b = BashOperator(task_id="b", bash_command="echo B")
    a >> b   # dependency: B requires A to finish first
```
]
]

# Operators

.boxed-content.no-bullet[
* .large[**BashOperator** — run shell commands (e.g., `date`, `sleep`)]
* .large[**PythonOperator** — run a Python callable]
* .large[**DockerOperator** — launch a container to do work]


.gray-text.larger[*Airflow* has many more via **providers** (e.g., SQL, cloud, filesystems).]

.larger[
```Python
from airflow.operators.python import PythonOperator

def prepare_dirs():
    """Create output folders and clear intermediate outputs from previous runs."""
    ...

with DAG(dag_id="python-task", schedule_interval=None) as dag:
    t_prepare = PythonOperator(
        task_id="prepare_dirs",
        python_callable=prepare_dirs,
    )

```
]

# Passing data: XCom

.boxed-content.large[
```python
from airflow.operators.python import PythonOperator

def produce(**ctx):
    return "hello"

def consume(**ctx):
    ti = ctx["ti"]
    print("Got:", ti.xcom_pull(task_ids="produce"))

p = PythonOperator(task_id="produce", python_callable=produce)
c = PythonOperator(task_id="consume", python_callable=consume, provide_context=True)
p >> c
```
]

.gray-text.larger[Useful sparingly; for larger data, persist to files/objects and pass **references**.]

# Good DAG hygiene (for this course)
<br />
.boxed-content.no-bullet[
* .large[<i class="fa-solid fa-minimize"></i> Keep tasks **small & deterministic**; idempotent if possible]

* .large[<i class="fa-solid fa-map-pin"></i> Prefer **explicit dependencies** (`a >> b`) to hidden coupling]

* .large[<i class="fa-solid fa-file-contract"></i> Use **parameters** and **env vars** instead of hard-coding paths]

* .large[<i class="fa-solid fa-clipboard"></i> Log **inputs/outputs**; keep an eye on **latency**]

* .large[<i class="fa-solid fa-spell-check"></i> Check Python **style**:
  ```Bash
  ruff check dags/ --select AIR301 --preview
  ```
  ]

]


???

In the context of workflows (like Airflow, Luigi, Nextflow, Snakemake, etc.),
an idempotent task is one that you can run multiple times with the same inputs
and it will always produce the same effect (same outputs, same state),
without causing corruption, duplication, or unintended side effects.

## Key ideas

* Deterministic outputs: Given the same inputs, the task always produces the same results.
* Safe to re-run: If a task is retried after a failure, or triggered again by accident, it won't “double-count” or otherwise break downstream steps.
* No destructive side effects: It doesn't accumulate garbage
  (e.g., append duplicates, create different filenames each time) unless that's the intended behavior.

# Step 1 — Get the official Compose stack

.boxed-content[
```bash
# In a new, empty directory
curl -LfO 'https://airflow.apache.org/docs/apache-airflow/2.11.0/docker-compose.yaml'

# Bind-mount folders Airflow expects
mkdir -p ./dags ./logs ./plugins ./config

# (Linux only) Make host UID visible
echo -e "AIRFLOW_UID=$(id -u)" > .env

# One-time DB & user init (user: airflow / pass: airflow)
docker-compose up airflow-init

# Start the stack (webserver, scheduler, worker, redis, postgres, flower)
docker-compose up
```
]

# Tip - Add scikit-learn to the airflow image

.boxed-content[
Create a `Dockerfile` where indicated in your `docker-compose.yaml` (e.g., `airflow/Dockerfile`):

.large[
```dockerfile
FROM apache/airflow:2.11.0-python3.9

USER root

# Add the Python environment
RUN python -m pip install -U --no-cache-dir pip && \
    python -m pip install --no-cache-dir "scikit-learn>=1.2"

# Back to the airflow user
USER airflow
```
]
]
