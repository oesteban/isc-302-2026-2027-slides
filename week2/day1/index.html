# Deployment and Job

.cards.cols-2[
.card[
.kicker[always running]

### Deployment

Keeps **N pods running**. A pod that exits is replaced, **even on exit 0**.
]
.card[
.kicker[run once]

### Job

Runs a pod **until it exits 0**, then stops. Nothing is restarted.
]
]

.boxed-content.small[
```console
# kubectl create deployment NAME --image=IMG --replicas=3
# kubectl create job        NAME --image=IMG -- CMD ARGS
```

# Starting a cluster, and a client for it

.boxed-content.small[
```console
$ mkdir kube
$ docker run -d --name k8s --privileged --tmpfs /run --tmpfs /var/run \
    -p 6443:6443 -v "$PWD/kube:/output" \
    rancher/k3s:v1.36.4-k3s1 server --disable=traefik \
    --write-kubeconfig /output/config --write-kubeconfig-mode 644

$ grep server: kube/config
    server: https://127.0.0.1:6443
```
]

.boxed-content.large.no-bullet[
* **k3s** is a Kubernetes distribution packaged as one binary. One container, one node, one cluster.
* The cluster writes its address and credentials to **your laptop**, into `kube/config`.
* **`kubectl` is not part of the cluster.** It is a client, and it lives wherever you want.
]

---

# The cluster has its own image store

.boxed-content.large[
k3s runs **containerd**. Your laptop runs the **Docker daemon**. Separate stores.
]

.boxed-content.large.no-bullet[
* `docker images` &rarr; your laptop.
* `crictl images` &rarr; the cluster.
* `ghcr.io/<user>/<name>` &rarr; the only path between them.
]

.admonition[
<i class="fa-solid fa-circle-right"></i> The cluster pulls with no credentials, so the package must be **public**.
]

# Let's jump back to 1998

.boxed-content[
<object type="image/svg+xml" data="images/big-data-google.svg" style="width: 100%; padding-top: 20pt;"></object>
]

???

An important algorithm, that's used to rank web pages by their relative importance, is called PageRank, after Larry Page, who came up with it (I'm serious, the name has nothing to do with web pages).
It's really a simple and brilliant algorithm, which basically counts how many links from other pages on the web point to a page. The page that has the highest count is ranked the highest (shown on top of search results). Of course, that's not the only method of determining page importance, but it's certainly the most relevant one.

Cutting and Cafarella made an excellent progress. Having Nutch deployed on a single machine (single-core processor, 1GB of RAM, RAID level 1 on eight hard drives, amounting to 1TB, then worth $3 000) they managed to achieve a respectable indexing rate of around 100 pages per second.

On one side it simplified the operational side of things, but on the other side it effectively limited the total number of pages to 100 million.

# GFS — how data is distributed

.boxed-content.large.no-bullet[
* <i class="fa-solid fa-file"></i> **Files** are divided in fixed-size chunks
  <br /> .indent.gray-text[**64 MB** each.]
  <br />
* <i class="fa-solid fa-copy"></i> **Default 3 replicas**
  <br /> .indent.gray-text[on different **chunkservers** (rack-aware placement).]
  <br />
* <i class="fa-solid fa-server"></i> A single **Master** keeps **metadata in memory**
  <br /> .indent.gray-text[a table of (filename&chunk, locations).]
  <br />
* <i class="fa-solid fa-terminal"></i> **Clients** ask the Master for **chunk locations**
  <br /> .indent.gray-text[however, read/write occurs **directly to chunkservers**.]
]

# MapReduce — word count (pseudocode)

.boxed-content.large[

``` Python
def map(_, line):
    for w in tokenize(line.lower()):
        if w and w not in STOPWORDS:
            yield (w, 1)

def shuffle(pairs):
    grouped = defaultdict(list)
    for k, v in pairs:
        grouped[k].append(v)
    return grouped.items()

def reduce(word, counts):
    return (word, sum(counts))
```

# MapReduce limitations

.boxed-content.large[
* **Iterative ML/graph** workloads: too many **re-reads** and **shuffles**.

* **Materialization** between stages → heavy **disk I/O**.

* Limited **optimization** opportunities at the MapReduce job level.

* Users wanted **interactive** and **iterative** workloads.
]

name: spark1

# Apache Spark (2009-2016)

.boxed-content.large[
* **HDFS** becomes a long-term storage layer.

* Immediate access now with **Resilient Distributed Dataset** (RDD).
  <br /> .gray-text[Data is loaded from HDFS **once**, then cached in memory.]

* Operations are chained in a **DAG**

* **Materialize** the output only at the end of the pipeline.
  <br /> .gray-text[To HDFS or other storage systems (S3, etc.).]
]

    # 2. Read text files into RDD 
    text_rdd = spark.sparkContext.textFile(f"{NEWSGROUPS_PATH}/*.txt")

    # 3-4. Convert to lowercase and split into tokens
    tokens_rdd = text_rdd.flatMap(
        lambda line: re.split(r"\W+", line.lower())
    )

    # 5. Filter out empty strings, numeric tokens, and stopwords
    filtered_rdd = tokens_rdd.filter(
        lambda token: (
            token != "" and
            not re.match(r'^[0-9]+$', token) and
            token not in stopword_list
        )
    )

    # 6. Map each token to (token, 1), then reduce
    word_counts = filtered_rdd.map(lambda w: (w, 1)) \
                              .reduceByKey(lambda a, b: a + b)

    # 7. Retrieve the top 15 by descending frequency
    top_15 = word_counts.takeOrdered(15, key=lambda x: -x[1])

#!/usr/bin/env python
"""
Spark job reading the 20 Newsgroups text files from an NFS path,
applying a stopword filter, and printing the top 15 most frequent tokens.
"""

import os
from pathlib import Path
from pyspark.sql import SparkSession
from pyspark.sql import functions as F

DATA_DIR = Path(os.getenv("SCRATCH", str(Path.home()))) / "datasets"
STOPWORDS_PATH = DATA_DIR / "stopwords.txt"
NEWSGROUPS_PATH = DATA_DIR / "newsgroups"

# Create a set of stop words we don't want to count such as "the"
stopword_list = {
  line.strip().lower()
  for line in STOPWORDS_PATH.read_text().splitlines() if line.strip()
}

def main():
    # 1. Initialize Spark
    spark = SparkSession.builder \
        .appName("WordCountOnNFS") \
