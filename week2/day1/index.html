# Point your Docker at the school's registry mirror

.boxed-content.large[
(Strongly recommended)

```json
{ "registry-mirrors": ["http://registry.isc3:5000"],
  "insecure-registries": ["registry.isc3:5000"] }
```
]

.cards.cols-2.tight[
.card[
.kicker[Linux]

### Edit the daemon file

Merge those two keys into `/etc/docker/daemon.json`, creating the file if it is not there,
then `sudo systemctl restart docker`.

.foot[Merge, do not overwrite: the file may already hold other settings.]
]
.card[
.kicker[macOS and Windows]

### There is no such file

The daemon runs inside a VM. **Docker Desktop &rarr; Settings &rarr; Docker Engine**, paste
the same two keys into the JSON shown there, then **Apply &amp; restart**.

.foot[Same two keys, same effect. Only the place you type them differs.]
]
]


???

insecure-registries is required because the mirror is plain HTTP; Docker refuses a
non-TLS registry that is not listed.

# &micro;Lab 3 .gray-text[· the four steps]

.cards.cols-2.tight[
.card.small[
.kicker[step 1]

### Fill the lab folder, then size the cluster

Clone the lab repository into `lab`, unzip `20news.zip` into `lab/data`, apply
`spark-standalone.yaml`, then `kubectl scale deployment spark-worker --replicas=4`.

.foot[Prove a pod can see it: `kubectl exec deploy/spark-worker -- ls /lab/data/20news | wc -l`]
]
.card.small[
.kicker[step 2]

### Count with the DataFrame API

`kubectl exec deploy/spark-master -- /opt/spark/bin/spark-submit` `--master spark://spark-master:7077` `/lab/wordcount_df.py /lab/data`

.foot[Record the elapsed time and the input partition count.]
]
.card.small[
.kicker[step 3]

### Start the RDD count in a second shell

The same line with `/lab/wordcount_rdd.py`, submitted from a **second** kubectl shell.

.foot[Two clients, one cluster. This one takes minutes. Start it, then read the step-2 plan while it runs.]
]
.card.small[
.kicker[step 4]

### Find the two shuffles

Scroll back to the plan in the first shell and find the two `Exchange` rows.

.foot[`Exchange` is the line where rows move between partitions.]
]
]

.admonition[
<i class="fa-solid fa-flag-checkered"></i> **Core by 13h10**: both counts submitted, both
plans printed, the two shuffles found. **Then**: `slowdown.py` at three partition counts,
and the same run again on a one-worker cluster.
]
