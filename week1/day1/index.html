]

<br />

.large[Like a river system, pipelines have **no feedback loops**]
]

???

But there's one critical characteristic that makes pipelines different from general workflows: they have no feedback loops.

They are like a river system: water flows from the source to the sea, but never back upstream.

There can be many tributaries (inputs) and distributaries (outputs), but the flow is always downstream.

# Why do we need pipelines?

.boxed-content[
<object type="image/svg+xml" data="images/big-data-workflow-03.svg" style="width: 100%; padding-top: 20pt;"></object>
]

???

Let's step back and consider the most general data processing workflow.

Overall, the data pipeline channels the flow of data from its initial capture to its final consumption.

Data can very rarely be analyzed or applied as they are generated or collected.

They need to be transformed before they can be used for analysis or decision.

This is why they are usually preprocessed, which involves transformations involving filtering, cleaning, normalizing, aggregating, etc.

Then, data are analyzed or "modeled", which can involve statistical analysis, machine learning,etc.

Finally, the results of the analysis are interpreted, visualized, and used to make decisions or take actions

---

.boxed-content[
<object type="image/svg+xml" data="images/big-data-workflow-00.svg" style="width: 100%; padding-top: 20pt;"></object>

Data capture and ingestion can involve collecting data from various sources, such as sensors, databases, or user inputs.

This data may be stored in a raw format.

Because raw formats are often not suitable for analysis, data need to be transformed through a series of steps in preprocessing.

For example, we may apply a smoothing filter to reduce noise in temperature time series, normalize values to a Kelvin scale or aggregate data from several thermometers.

During modeling, we identify patterns, trends, or relationships in the data.

We also prepare them for consumption or decision, e.g., by generating visualizations or summary statistics.

# Amdahl's law (upper bound on speedup)

.pull-left[
<br />

.larger[Given a fixed workload, the latency speedup $S_\text{latency}$ relates to fraction of parallelizable work $p$ and parallelization factor $s$ as:]

.large[
\\[
S_\text{latency} \le \frac{1}{1 - p + \frac{p}{s}}
\\]
]

.larger[When $s \to \infty$, then $S_\text{latency} \le \frac{1}{1 - p}$.]

.gray-text[
If only 10% of the total latency is parallelizable ($p=0.1$), then $S_\text{latency} \le 1.11$,
then with infinite resources we can only speed up the total latency by 11%.
]
]

.pull-right.center[
<br />
<a href="https://commons.wikimedia.org/wiki/File:AmdahlsLaw.svg#/media/File:AmdahlsLaw.svg">
<img alt="River system" src="https://upload.wikimedia.org/wikipedia/commons/e/ea/AmdahlsLaw.svg" style="width: 90%; margin-top: 20px; padding: 4px; border: 1px solid #ccc; box-shadow: 2px 2px 6px rgba(0,0,0,0.3);" />
</a><br>By <a href="https://en.wikipedia.org/wiki/User:Daniels220" class="extiw" title="wikipedia:User:Daniels220">Daniels220</a> at <a href="https://en.wikipedia.org/wiki/Amdahl%27s_law" class="extiw" title="wikipedia:">Wikipedia</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0" title="Creative Commons Attribution-Share Alike 3.0">CC BY-SA 3.0</a>
]

# ETL or ELT: .gray-text[many sensors, many sampling rates]

.cards.cols-3.larger[
.card.step-1[
.section-icon.corner[<i class="fa-solid fa-filter"></i>]

### ETL

Curate **before** you store.

.foot[Data stored in tables at one fixed rate: fast channels anti-alias filtered then downsampled, slow ones padded with N/A, outliers rejected on the way in.]
]
.card.step-3[
.section-icon.corner[<i class="fa-solid fa-shuffle"></i>]

### Hybrid

Interpret on arrival, reshape **after**.

.foot[Streams are stored with their original sampling rate in different tables with a pre-defined schema. Drops some metadata that is not necessary given the schema.]
]
.card.step-2[
.section-icon.corner[<i class="fa-solid fa-database"></i>]

### ELT

Land it raw, shape it **after**.

.foot[Each stream preserved "untouched" in an object store as the device sends it, plus the metadata to interpret it.]
]
]

.plan-table.large[
<table>

</tbody>
</table>
]

- ETL feels familiar to strict pipelines (neuroimaging with rigid file contracts).  
- ELT is popular where warehouses scale elastically.

# [Data] Warehouses, Marts & Lakes

.cards.cols-2[
.card[
<img src="images/geodata-prep.png" style="width: 100%; height: 150px; object-fit: cover; object-position: center 22%; border-radius: 8px" />

### ETL

Stores in a *Data Warehouse* (DW), with a fixed schema.

.foot[**Data mart**: a subject-area subset of a DW, scoped to one team, product or domain (e.g., finance mart, a clinical mart). ]
]
.card[
<img src="images/orography.png" style="width: 100%; height: 150px; object-fit: cover; border-radius: 8px" />

### ELT

* .large[<i class="fa-solid fa-warehouse"></i></i> **Data warehouse** (DW)]
  <br /> .indent.larger[Curated, **structured** data optimized for analytics (columnar, SQL, governance).]

- Warehouse: BigQuery/Snowflake/Redshift curated tables.  
- Mart: Finance or Clinical mart from the central warehouse.  
- Lake: S3/ADLS/GCS with Parquet/JSON, images, binaries.

# Standard ELT: a DL of Parquet files

.cards.cols-3.vcenter[
.card[
### Parquet

A **columnar file format** for fast storage and retrieval of large datasets.
Typically, folders logically structure parquet files, which keep arriving to the DL.

.foot[The file format determines how the data is stored.]
]
.card[
### A *naive* structure

If data is being added to the DL (e.g., new parquet files), 
a simultaneous query will run on a dirty state (some new files will be read, some ignored).

.foot[The DL cannot be queried directly because how those many files create a table together is unknown.]

]
.card[
### "Meta-" table formats

Creates a **snapshot** (e.g., with manifest files) that allows seeing
a pool of Parquet files as an actual table with optimizations
such as leveraging Parquet's columnar storage.

.foot[**Iceberg**, Delta Lake, Hudi.]
]
]

???

Two more, if they ask:

- Two jobs writing at once overwrite each other's files.
- Renaming a column means rewriting every file, because the name lives in each footer.

class: vcenter, stepwise

# Types of data pipelines in terms of input timing

.cards.cols-3.larger[
.card.step-1[
.section-icon.corner[<i class="fa-solid fa-box"></i>]

.kicker[Latency: hours]

### Batch

A dataset has clear starting and ending points,
and can be processed in one go.

.foot[For example, a CSV file with 12 days of data from sensors sampling at 1 KHz (&sim;1 million rows).]
]
.card.step-3[
.section-icon.corner[<i class="fa-solid fa-stopwatch"></i>]

.kicker[Latency: minutes]

### Micro-batch

The input is unbounded, but it is cut into small
bounded chunks of a few seconds.

.foot[For example, the same sensor readings, grouped into 1-day chunks (&sim;90,000 rows).]
]
.card.step-2[
.section-icon.corner[<i class="fa-solid fa-infinity"></i>]

.kicker[Latency: seconds]

### Streaming

The input is unbounded because the dataset is continuously
growing.

.foot[For example, real-time trading data, or a sensor that keeps sending readings.]
]
]

???

Micro-batch is the compromise: batch machinery, seconds of latency instead of milliseconds. It is how Spark Structured Streaming reuses the batch engine.

# Handling streams .gray-text[(e.g., Apache Kafka)]

.cards.cols-2.vcenter[
.card[
### A queue

Deletes a message once it is consumed. One reader gets it, and a restart loses what was in flight.
]
.card[
### A log

**Appends and retains.** Every reader keeps its own offset, so any number of them read all of it, and can read it again.
]
.card.wide.accent[
That one difference is why a broker sits between producers and consumers, instead of a queue you wrote yourself.

.foot[Topic 6, drawn this afternoon.]
]
]
