# ---------------------------------------------------------------------------
# flipped-topics.yml — the sixteen flipped-class topics, weeks 1-3.
#
# SINGLE SOURCE OF TRUTH. The printed worksheets (flipped-worksheets.typ) are
# generated from this file, and the deck's topic list should be too. The 25-26
# list drifted precisely because it lived only in a slide; do not copy topics
# into a deck by hand.
#
#   typst compile flipped-worksheets.typ            # the 16 printed briefs
#   python3 ../../../tools/check-topics.py          # deck vs this file
#
# Ordering is deliberate: easiest-after-seeding first. A topic the lecture has
# already introduced can be hard; a topic nobody has mentioned must be easy or
# late. Slot order therefore encodes difficulty *after* seeding, not raw
# difficulty.
# ---------------------------------------------------------------------------

course: "302 Data infrastructures"
section: "Data pipelines, weeks 1-3"
teacher: "Oscar Esteban"
lottery: "Monday 14 September, afternoon"

# Deadlines are D-5, D-3, D-1 (18:00). Each worksheet prints its own slot's
# dates, so a student never has to look up a schedule.
slots:
