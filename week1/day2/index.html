Reasons why 'it works [only] on my machine':

* One or more files are missing (meaning, the installation is not reproducible).
* Software versions mismatch (e.g., Python 3.8 vs 3.10, or a dependency).
* Different settings:
  * Environment variables different or not set (e.g., `PATH`, `PYTHONPATH`, etc.).
  * Configuration files
  * Permissions
  * Platform specific settings (e.g., slightly different hardware)


Examples of why:

* Deployment on production
* A new recruit joins the team
* Version control of deployiment settings (`Dockerfile`)

# Virtual machines vs. containers

.cards.cols-2[
.card[
.section-icon.corner[<i class="fa-solid fa-server"></i>]

.kicker[requires its own kernel]

### Virtual machine

A simulated computer (*guest machine*) running a full OS stack on top of a **hypervisor**.
The hypervisor provides the guest OS with a virtual platform (the virtual hardware).

.foot[
* Booting the virtual OS takes a minute (or more),
* images are large,
* strong isolation, and
* hardware capacity can be scaled down.]
]
.card[
.section-icon.corner[<i class="fa-solid fa-cubes"></i>]

.kicker[shares the host's kernel]

### Container

Uses LXC (**Linux Containers**), which enables a Linux system
share it's **kernel**.
The container registers isolated *processes* that use the kernel.

.foot[
* Spinning up a container is a matter of seconds,
* images are relatively small, and
* they use the hardware directly, at full capacity.]
]
]

.admonition[
.large[<i class="fa-solid fa-circle-right"></i> **Both** run apps on isolated environments]
]

???

* Containers share the host OS kernel, and isolate the application processes from the rest of the system.
* Virtual machines simulate the physical hardware and install a full OS stack with its own kernel.

BOTH run apps on isolated environments.

**Hypervisor**: software layer that leverages hardware (directly—type 1,—or through the OS—type 2)
virtualization to create and run virtual machines.

* VirtualBox (type 2, cross-platform)
* VMware (type 2, cross-platform)
* KVM (type 2, Linux)
* bhyve (type 2, FreeBSD)
* Parallels (type 2, macOS)
* Xen (type 1, Linux)
* VMware ESXi (type 1, server)
* Hyper-V (type 1, Windows)

Main caveats of VMs vs containers—each VM needs a full OS:
* Heavy (GBs)
* Slow to boot (minutes)
* More resource hungry (RAM, CPU). Eg., 2 VMs with 2GB RAM each on a host with 4GB RAM will likely
  lead to swapping and very poor performance.
* More HPC-friendly (though, Docker is generally not found in HPC settings)

Benefits of VMs vs containers—each VM is fully isolated:
* More secure (stronger isolation)

# How can containers run on MacOSX or Windows?

.cards.cols-3[
.card[
.section-icon.corner[<i class="fa-solid fa-laptop"></i>]

.kicker[Containers need LXC]

### No Linux kernel

Neither MacOSX or Windows have a Linux kernel,
**they cannot run containers natively**.

.foot[Exception: Windows' WSL]
]
.card[
.section-icon.corner[<i class="fa-solid fa-layer-group"></i>]

.kicker[VMs to the rescue]

### Run Linux on a VM

Docker Desktop runs a virtual machine and a Linux on top.

.foot[`docker info` &mdash; the OS it reports is not the one you booted.]
]
.card.alert[
.section-icon.corner[<i class="fa-solid fa-triangle-exclamation"></i>]

.kicker[Tricky question]

### Apple's M2 is ARM64

The VM runs Linux, but on the ARM64 architecture.
If all or some software in the container image is only compiled for AMD64,
the architecture must be **emulated** for the container,
instruction by instruction.

.foot[Emulate instruction-by-instruction **is very slow**.]
]
]

.admonition.warning[
<i class="fa-solid fa-triangle-exclamation"></i> The promise that containers *run the same everywhere* meets one limitation with varying architectures.
]

.pull-left.large[

* Traditional, legacy, and/or monolithic workloads
* Isolate risky development cycles
* Provision infrastructure (networks, server, data)

.pull-right.large[
Containers win at:

* Packaging microservices.
* Deploying applications into DevOps and CI/CD.

# Images vs. containers

.cards.cols-2[
.card[
.section-icon.corner[<i class="fa-solid fa-box-archive"></i>]

.kicker[on disk, read-only]

### Image

A stack of **layers** plus metadata. Built once, pushed, pulled, identical everywhere.

.foot[
* `docker image ls` &mdash; lists pulled images.
* `docker image history &lt;image&gt;` &mdash; see the layers of an image.]
]
.card[
.section-icon.corner[<i class="fa-solid fa-play"></i>]

.kicker[running, writable, disposable]

### Container

One **process tree** started from an image, with a thin writable layer on top.

.foot[
* `docker ps` &mdash; see what's currently running.
* `docker ps -a` &mdash; see what has been run.
]
]
]

.admonition[
.larger[<i class="fa-solid fa-circle-right"></i> Best practice: clear the container after execution adding `--rm` to the `docker run` command.]
]

???

Image = immutable filesystem changes + metadata.

Container = runtime instance of an image.

Whalesay works the same in all your computers.

[Why we need a different container purely for apps - Mark Suttleworth (Canonical)](https://www.youtube.com/watch?v=0z3yusiCOCk&t=550s)

# The first Dockerfile (`oesteban/whalesay`)

.boxed-content[
.large[
```dockerfile
FROM alpine
RUN apk add --no-cache perl
COPY cowsay /usr/local/bin/cowsay
COPY *.cow /usr/local/share/cows/
COPY docker.cow /usr/local/share/cows/default.cow
ENTRYPOINT ["/usr/local/bin/cowsay"]
```

[`FROM`](https://docs.docker.com/reference/dockerfile/#from) indicates a base image (`alpine`)

[`RUN`](https://docs.docker.com/reference/dockerfile/#run) executes commands in the image being built (`apk add`)

[`COPY`](https://docs.docker.com/reference/dockerfile/#copy) copies files from the build context into the image

[`ENTRYPOINT`](https://docs.docker.com/reference/dockerfile/#entrypoint) configures a container that will be run from the image

]]

???

How this recipe translates into natural language:

> Start with an alpine linux distribution.
> Install perl without caching installation files (to save space)
> Copy the `cowsay` perl script into the image, at `/usr/local/bin/cowsay`
> Copy every `.cow` template in the build context into the image, at the right path
> Copy the Docker whale a second time, under the name `cowsay` reaches for when you do not name one
> Tell the Docker runtime to execute `/usr/local/bin/cowsay` when it is invoked.

The glob on the fourth line is the one to point at: it is why dropping a new
`.cow` file into the repo and rebuilding is enough, with no edit to the
`Dockerfile` at all. That is what round 1 depends on.

## The script (`web/cgi-bin/cow`)
```
#!/bin/sh
echo "Content-type: text/html"
echo
say=$(printf '%s' "$QUERY_STRING" | sed -n 's/^.*message=\([^&]*\).*$/\1/p' | sed 's/+/ /g')
[ -z "$say" ] && say="try /?message=hello"
echo "<pre>"
docker run --rm my_whale -f group-N "$say"
echo "</pre>"

# The CI/CD workflow

.boxed-content.scroll-y[
```
name: image

on:
  pull_request:
  push:
    # Both names, so this works whatever your default branch is called.
    branches: [main, master]

permissions:
  contents: read
  packages: write        # without this the publish step fails with a 403

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ghcr.io rejects uppercase, and GitHub usernames keep their case.
      - name: Work out the image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # On a pull request this is false: the image is built and thrown away.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          # One line, two architectures. It is not free: the build gets slower.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
```
]

# Build context &amp; `.dockerignore`

.cards.cols-2[
.card[
.section-icon.corner[<i class="fa-solid fa-box"></i>]

.kicker[Build context]

### Docker packs up the folder

Note the trailing `.` (= *current working directory*) in

```
docker build -t my_whale .
```


Docker hands the daemon **all the content in `.`** before reading a single instruction.

.foot[In &micro;Lab 1, that passes `web/` too.]
]
.card[
.section-icon.corner[<i class="fa-solid fa-scissors"></i>]

.kicker[Excluding content from the context]

* `.dockerignore` sits next to the `Dockerfile`,
* `.dockerignore` allows one pattern per line,
* adding `web/` in it, Docker stops carrying `web/` on every build.

.foot[Watch the `transferring context` line to see it.]
]
]

.admonition[
.large[<i class="fa-solid fa-circle-right"></i> In this case, `my_whale`'s size does not change (because nothing from `web/` was *added* into the image).]
]

???

Two things worth saying out loud, but not worth a card:

* The GitHub Actions run does the same thing. `docker/build-push-action` is
  given `context: .`, so the workflow you watched earlier also ships the whole
  repository, and it also reads `.dockerignore`.

* Ignoring `web/` does not break `docker build -t cow-web ./web`. That build
  passes `web/` **as** the context, and `.dockerignore` is read from the root of
  whatever context you passed: here that would be `web/.dockerignore`, which
  does not exist.

.card[
.kicker[step 3]

### Give it the socket and a volume

.small[
```
docker volume create project
docker run -p 8888:8888 -v project:/work \
  -v /var/run/docker.sock:/var/run/docker.sock notebook
```
]
]
.card[
.kicker[step 4]

### Use Docker from the notebook

.small[
```
!docker run --rm -v project:/project \
  oesteban/neuropipeline-302 mri_synthstrip \
  -i /project/T1w.nii.gz -o /project/brain.nii.gz
```
]
]
]

.admonition.warning[
<i class="fa-solid fa-triangle-exclamation"></i> Use a **named volume**, not a path. `-v /some/dir:/project` is resolved by the *daemon*, not inside your notebook &mdash; so a directory that exists only in your container arrives **empty**, with no error.
]

# One command, unpacked

.boxed-content.large[
```console
$ k3d cluster create hello302 --agents 2 --wait
```
]

.boxed-content.no-bullet[
* .large[<i class="fa-solid fa-circle-right"></i> `k3d` builds a Kubernetes cluster **out of Docker containers**, and `hello302` is the name you give it. You already have Docker, and that is the whole reason this works on a laptop.]

* .large[<i class="fa-solid fa-circle-right"></i> `--agents 2` asks for **two worker machines**. A third one runs the cluster itself. Keep that number in mind for the next slide.]

* .large[<i class="fa-solid fa-circle-right"></i> `--wait` means *do not give the prompt back until it is really up*.]

* .large[<i class="fa-solid fa-circle-right"></i> `kubectl` is the command that talks to a cluster. From here on, it is the only one you type.]
]

???

# What you just started

.cards.cols-3[
.card[
.section-icon.corner[<i class="fa-solid fa-server"></i>]

.kicker[three of them]

### Nodes

Machines that run your containers. Yours are three Docker containers pretending to be
three machines.

.foot[`kubectl get nodes -o wide`]
]
.card[
.section-icon.corner[<i class="fa-solid fa-file-code"></i>]

.kicker[what you write]

### Manifests

YAML you `kubectl apply -f`. Three nouns today: **Deployment**, **Service**, **Pod**.

.foot[You describe what should be true, not what to do.]
]
.card[
.section-icon.corner[<i class="fa-solid fa-tower-broadcast"></i>]

.kicker[who you talk to]

### The API server

You never address a node. `kubectl` is an HTTP client with a config file.

.foot[Which is why the same file works on a laptop and on a cluster.]
]
]

.admonition[
<i class="fa-solid fa-circle-right"></i> k3d runs **k3s**, the same distribution as the ISC cluster. Not a simulator.
]

# `replicas: 2` is a wish, not a command

.boxed-content.large[
You never said *start a container*. You said **how many should exist**.

A controller compares what exists against what you asked for, and closes the gap.
Continuously. Delete a pod and a replacement is serving in about **seven seconds**,
without you asking for one.
]

.admonition[
<i class="fa-solid fa-circle-right"></i> When something is wrong: `kubectl describe pod &lt;name&gt;` and **read the `Events` block at the bottom**. It is where Kubernetes explains itself.
]

# **&micro;Lab 3** .gray-text[· hello, Kubernetes]

.cards.cols-2.tight[
.card[
.kicker[step 1]

### Your own namespace

`kubectl create namespace hello-&lt;name&gt;` then make it the default for this context.

.foot[On a shared cluster this is the wall between you and everyone else.]
]
.card[
.kicker[step 2]

### Apply the manifest

`kubectl apply -f hello-k8s.yaml`, then `kubectl get pods -o wide`.

.foot[Two pods, and the `NODE` column should not be the same for both.]
]
.card[
.kicker[step 3]

### Scale, then break it

`kubectl scale deploy/hello --replicas=5`, then delete a pod and `kubectl get pods -w`.

]

.kicker[step 4]

### Everyone&apos;s receipt

**On each laptop**: `kubectl get nodes` &mdash; three `Ready`. Monday morning has no time to fix a cluster; today does.
